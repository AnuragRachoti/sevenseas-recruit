<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SevenSeas Recruitment Command Center</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">7S</div>
      <div><div class="brand-name">SevenSeas</div><div class="brand-sub">Recruitment Command Center</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot" id="ai-status"></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="search-wrap"><input id="global-search" placeholder="Search candidates, vacancies, clients…" autocomplete="off" /><div id="search-results" class="search-results"></div></div>
      <div class="top-actions">
        <button class="btn ghost" id="run-auto" title="Re-run matching and create due tasks now">↻ Run automation</button>
        <label class="acting">Acting as <select id="user-select"></select></label>
      </div>
    </header>
    <main id="view"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
